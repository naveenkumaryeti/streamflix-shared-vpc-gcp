# StreamFlix - tiny 3-tier demo
services:
  frontend:                      # TIER 1 - presentation
    build: ./frontend
    ports:
      - "8080:80"                # only tier exposed to the host
    depends_on:
      - backend
    networks:
      web-net:
      app-net:

  backend:                       # TIER 2 - application logic
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: streamflix
      DB_USER: streamflix
      DB_PASSWORD: streamflix123
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-net:
      data-net:

  db:                            # TIER 3 - data
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamflix
      POSTGRES_USER: streamflix
      POSTGRES_PASSWORD: streamflix123
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamflix -d streamflix"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      data-net:

# Subnets mirror the Shared VPC design (10.10.0.0/16)
networks:
  web-net:
    ipam: { config: [{ subnet: 10.10.1.0/24 }] }
  app-net:
    ipam: { config: [{ subnet: 10.10.2.0/24 }] }
  data-net:
    internal: true               # no internet access, DB stays private
    ipam: { config: [{ subnet: 10.10.3.0/24 }] }

volumes:
  db-data:
